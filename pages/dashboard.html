<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofre Furado - Dashboard</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="stylesheet" href="../style/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <img src="../img/logo.png" alt="Logo Cofre Furado">
            <h2>Cofre Furado</h2>
        </div>
        <nav class="nav-links">
            <a href="#" class="ativo">Visão Geral</a>
            <a href="#">Transações</a>
            <a href="#">Metas</a>
            <a href="#">Configurações</a>
        </nav>
        <button id="btn-sair" class="btn-sair">Sair da Conta</button>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="boas-vindas">
                <h1>Olá, Nathan! 👋</h1>
                <p>Aqui está o resumo das suas finanças.</p>
            </div>
            <button id="btn-abrir-modal" class="btn-primario">+ Nova Transação</button>
        </header>

        <section class="cards-resumo">
            <div class="card">
                <h3>Saldo Atual</h3>
                <p class="valor positivo" id="saldo-atual">R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Receitas (Mês)</h3>
                <p class="valor positivo" id="receitas-mes">+ R$ 0,00</p>
            </div>
            <div class="card">
                <h3>Despesas (Mês)</h3>
                <p class="valor negativo" id="despesas-mes">- R$ 0,00</p>
            </div>
        </section>

        <section class="tabela-transacoes">
            <h2>Últimas Transações</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Descrição</th>
                            <th>Categoria</th>
                            <th>Data</th>
                            <th>Valor</th>
                            <th>Ações</th> 
                        </tr>
                    </thead>
                   
                    <tbody id="tbody-transacoes">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal-transacao" class="modal-overlay oculto">
        <div class="modal-caixa">
            <div class="modal-header">
                <h2>Nova Transação</h2>
                <button id="btn-fechar-modal" class="btn-fechar">&times;</button>
            </div>
            <form id="form-transacao" novalidate>
                <label for="tipo-transacao">Tipo:</label>
                <select id="tipo-transacao" name="tipo" required>
                    <option value="despesa">Despesa (Saída)</option>
                    <option value="receita">Receita (Entrada)</option>
                </select>

                <label for="desc-transacao">Descrição:</label>
                <input type="text" id="desc-transacao" name="descricao" placeholder="Ex: Peças para o carro, Lanche..." required>

                <label for="cat-transacao">Categoria:</label>
                <input type="text" id="cat-transacao" name="categoria" placeholder="Ex: Carro, Alimentação, Lazer..." required>

                <label for="valor-transacao">Valor (R$):</label>
                <input type="number" id="valor-transacao" name="valor" step="0.01" placeholder="0.00" required>

                <label for="data-transacao">Data:</label>
                <input type="date" id="data-transacao" name="data" required>

                <button type="submit" class="btn-primario btn-salvar">Salvar Transação</button>
            </form>
        </div>
    </div>

    <script type="module" src="../js/script.js"></script>
    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
