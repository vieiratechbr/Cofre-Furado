<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofre Furado</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="stylesheet" href="../style/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header-principal">
        <a href="../index.html" class="brand-header" style="text-decoration: none;">
            <img src="../img/logo.png" alt="Logo Cofre Furado" class="logo-img">
            <h2>Cofre Furado</h2>
        </a>
        <nav class="menu">
            <a href="suporte.html" class="btn-menu">Suporte</a>
        </nav>
    </header>
    
    <main class="login-container">
        <div class="caixa">
            <h2>Entrar</h2>
            <form id="form-login" novalidate>
                <div id="area-tradicional">
                    <label for="email-login">Email:</label>
                    <input type="email" id="email-login" name="email" placeholder="Insira seu email aqui" required>
                    <span class="erro-msg" id="erro-email-login"></span>
                    
                    <label for="senha-login">Senha:</label>
                        <div class="input-senha-container">
                            <input type="password" id="senha-login" name="senha" placeholder="Insira sua senha aqui" required>
                                <button type="button" class="btn-toggle-senha" data-target="senha-login">
                                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                                </button>
                        </div>
                    <span class="erro-msg" id="erro-senha-login"></span>
                    
                    <button type="submit" class="btn-primario">Entrar</button>
                </div>

                <div id="area-alternativas">
                    <div class="separador">ou</div>
                    
                    <button type="button" id="btn-google">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px">
                            <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                            <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                            <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                            <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                        </svg>
                        Entrar com Google
                    </button>
                </div>

                <p class="login-link">
                    Não tem conta? <a href="cadastro.html">Cadastre-se</a>
                </p>
            </form>
        </div>
    </main>
    
    <script type="module" src="../js/app.js"></script>
</body>
</html>
