<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofre Furado - Suporte</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="stylesheet" href="../style/suporte.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header-principal">
        <a href="../index.html" class="brand-header" style="text-decoration: none;">
            <img src="../img/logo.png" alt="Logo Cofre Furado" class="logo-img">
            <h2>Cofre Furado</h2>
        </a>
        <nav class="menu">
            <a href="login.html" class="btn-menu">Login</a>
            <a href="cadastro.html" class="btn-menu">Cadastre-se</a>
        </nav>
    </header>
    
    <main class="suporte-container">
        <div class="caixa">
            <h2>Suporte</h2>
            <p class="texto-suporte">Como podemos ajudar? Envie sua dúvida ou sugestão e responderemos o mais rápido possível.</p>
            
            <form id="form-suporte" novalidate>
                <label for="nome-suporte">Nome completo:</label>
                <input type="text" id="nome-suporte" name="nome" placeholder="Digite seu nome" required>
                
                <label for="email-suporte">Email:</label>
                <input type="email" id="email-suporte" name="email" placeholder="Digite seu e-mail" required>
                
                <label for="assunto-suporte">Assunto:</label>
                <input type="text" id="assunto-suporte" name="assunto" placeholder="Ex: Problema com login" required>
                
                <label for="mensagem-suporte">Mensagem:</label>
                <textarea id="mensagem-suporte" name="mensagem" placeholder="Descreva sua dúvida detalhadamente..." required></textarea>
                
                <button type="submit" class="btn-primario">Enviar Mensagem</button>
            </form>
        </div>
    </main>
</body>
</html>
