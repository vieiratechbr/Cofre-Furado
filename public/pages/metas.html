<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas - Cofre Furado</title>
    <link rel="icon" type="image/png" href="../img/logo.png">
    <link rel="stylesheet" href="../style/dashboard.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <img src="../img/logo.png" alt="Logo Cofre Furado">
            <h2>Cofre Furado</h2>
        </div>
        <nav class="nav-links">
            <a href="dashboard.html">Visão Geral</a>
            <a href="transacoes.html">Transações</a>
            <a href="metas.html" class="ativo">Metas</a>
            <a href="cartoes.html" id="menu-cartoes" class="menu-premium">Cartões</a>
            <a href="configuracoes.html">Configurações</a>
        </nav>
        <button id="btn-sair" class="btn-sair">Sair da Conta</button>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="boas-vindas">
                <h1 id="saudacao-usuario">Suas Metas 🎯</h1>
                <p>Acompanhe seus objetivos financeiros.</p>
            </div>
            <button id="btn-nova-meta" class="btn-primario">+ Nova Meta</button>
        </header>
        
        <section id="metas-container" class="metas-grid">
        </section>
    </main>

    <div id="modal-meta" class="modal-overlay oculto">
        <div class="modal-caixa">
            <div class="modal-header">
                <h2>Criar Objetivo</h2>
                <button id="btn-fechar-modal-meta" class="btn-fechar">&times;</button>
            </div>
            <form id="form-meta" novalidate>
                <label for="nome-meta">Nome do Objetivo:</label>
                <input type="text" id="nome-meta" placeholder="Ex: Viagem, Carro Novo, Reserva..." required>

                <label for="valor-alvo-meta">Valor Alvo (R$):</label>
                <input type="number" id="valor-alvo-meta" step="0.01" placeholder="Ex: 5000.00" required>

                <label for="valor-atual-meta">Já tenho guardado (R$):</label>
                <input type="number" id="valor-atual-meta" step="0.01" placeholder="Ex: 500.00" value="0">

                <button type="submit" class="btn-primario btn-salvar">Salvar Meta</button>
            </form>
        </div>
    </div>

    <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
